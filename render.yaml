services:
  - type: web
    name: invoice-action-agent
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: DATABASE_PATH
        value: /data/invoice_agent.db
    disk:
      name: invoice-agent-state
      mountPath: /data
      sizeGB: 1
