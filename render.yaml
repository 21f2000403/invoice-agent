services:
  - type: web
    name: invoice-action-agent
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DATABASE_PATH
        value: /data/invoice_agent.db
    disk:
      name: invoice-agent-state
      mountPath: /data
      sizeGB: 1
